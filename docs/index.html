<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F2">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">
  <title>你和中国哪座城市最匹配</title>
  <meta name="description" content="24 道生活小题，找到最懂你的那座城">
  <link rel="stylesheet" href="assets/style.css?v=09bc44a4">
</head>
<body>
  <main class="wrap" id="app">
    <!-- 封面 -->
    <section id="view-intro" class="intro" aria-labelledby="intro-title">
      <span class="badge">城市灵魂匹配测试</span>
      <div class="intro-art" aria-hidden="true">🏮🏔️🌆</div>
      <h1 id="intro-title">你和中国<br>哪座城市最匹配</h1>
      <p class="lead">从生活节奏、社交能量到口味和气候，<br>8 个维度读懂你，找到最懂你的那座城。</p>
      <div class="intro-meta">
        <div><b id="meta-count">24</b>道题</div>
        <div><b>8</b>个维度</div>
        <div><b>24</b>座城市</div>
      </div>
      <button class="btn" id="btn-start" type="button">开始测试</button>
      <button class="btn btn-ghost" id="btn-last" type="button" hidden>查看上次的结果</button>
      <p class="tip">凭第一直觉作答就好，没有对错之分</p>
    </section>

    <!-- 答题 -->
    <section id="view-quiz" hidden aria-live="polite">
      <div class="quiz-top">
        <button class="back" id="btn-back" type="button" aria-label="上一题">‹</button>
        <div class="progress" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"><i id="progress-fill"></i></div>
        <span class="count" id="q-count">1/24</span>
      </div>
      <div class="q-card" id="q-card">
        <p class="q-dim" id="q-dim"></p>
        <h2 class="q-text" id="q-text"></h2>
        <ul class="options" id="q-options"></ul>
      </div>
    </section>

    <!-- 计算中 -->
    <section id="view-loading" class="loading" hidden aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">正在分析你的生活偏好…</p>
    </section>

    <!-- 结果 -->
    <section id="view-result" class="result" hidden></section>
  </main>

  <script src="data/city.js?v=488748ba"></script>
  <script src="assets/engine.js?v=4839eee2"></script>
  <script src="assets/fit.js?v=6661d843"></script>
  <script src="assets/share.js?v=0ede6c09"></script>
  <script src="assets/city.js?v=db709a93"></script>
</body>
</html>
